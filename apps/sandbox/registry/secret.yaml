# The "htpasswd" value in Infisical must be the exact output of:
#   htpasswd -nbB <user> <password>
# i.e. a "user:bcrypt-hash" line (or multiple newline-separated lines for
# multiple users) - not a plaintext password. Generate it locally once and
# paste the result into Infisical; never commit it to this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-htpasswd
  namespace: registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: sandbox-secretstore
  target:
    name: registry-htpasswd
  data:
    - secretKey: htpasswd
      remoteRef:
        key: /registry/htpasswd

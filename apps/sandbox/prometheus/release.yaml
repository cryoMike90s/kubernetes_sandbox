apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  values:
    grafana:
      enabled: true
      persistence:
        enabled: true
        storageClassName: default-kubernetes-sandbox-storageclass
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      admin:
        existingSecret: grafana-admin-credentials
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: default-kubernetes-sandbox-storageclass
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi

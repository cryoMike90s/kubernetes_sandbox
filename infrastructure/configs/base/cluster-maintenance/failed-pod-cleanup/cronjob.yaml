apiVersion: batch/v1
kind: CronJob
metadata:
  name: failed-pod-cleanup
  namespace: cluster-maintenance
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: failed-pod-cleanup
          restartPolicy: OnFailure
          containers:
            - name: failed-pod-cleanup
              image: rancher/kubectl:v1.32.13
              args:
                - delete
                - pods
                - --all-namespaces
                - --field-selector=status.phase=Failed

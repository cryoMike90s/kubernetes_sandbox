---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: failed-pod-cleanup
  namespace: cluster-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: failed-pod-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: failed-pod-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: failed-pod-cleanup
subjects:
  - kind: ServiceAccount
    name: failed-pod-cleanup
    namespace: cluster-maintenance

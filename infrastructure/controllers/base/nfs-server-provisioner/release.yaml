apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-server-provisioner
spec:
  releaseName: nfs-server-provisioner
  chart:
    spec:
      chart: nfs-server-provisioner
      sourceRef:
        kind: HelmRepository
        name: nfs-server-provisioner
        namespace: nfs-system
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    persistence:
      enabled: true
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 200Gi
    # This chart's Ganesha server only exports paths its own controller
    # creates dynamically for PVCs using its own provisioner name - it does
    # NOT statically export /export for an external provisioner (csi-driver-nfs)
    # to mount. Use its built-in StorageClass/provisioner directly instead,
    # keeping the same name so nothing downstream has to change.
    storageClass:
      create: true
      defaultClass: true
      name: default-kubernetes-sandbox-storageclass
    # Local storage is node-local: pin the server to the worker with the most
    # free disk (192.168.0.80) so its PVC always lands on the same node.
    nodeSelector:
      kubernetes.io/hostname: talos-d06-bmc
